<section class="bg-base-100 rounded-xl shadow-md p-6 mt-10 relative overflow-hidden animate-fade-in">
    <!-- Contenido -->
    <div class="text-center space-y-6">
        <!-- Logo -->
        <div class="animate-fade-in-scale" style="animation-delay: 50ms">
            <img src="assets/img/logo-fondo-blanco.jpg" alt="Juegos Angular Logo" class="mx-auto h-24 w-auto rounded-lg shadow-sm">
        </div>
        
        <p class="m-0 text-neutral text-lg animate-slide-in-up" style="animation-delay: 100ms">
            Bienvenido a
            <span class="font-semibold text-accent">Juegos Angular</span>
        </p>
        <p class="mt-2 text-sm text-neutral/80 animate-slide-in-up max-w-md mx-auto" style="animation-delay: 200ms">
            Una aplicación interactiva que combina entretenimiento y aprendizaje. Explora elementos químicos, 
            conoce personajes únicos y disfruta de emocionantes juegos de memoria, todo desarrollado con Angular.
        </p>

        <!-- Botón -->
        <div class="mt-4 animate-slide-in-up" style="animation-delay: 300ms">
            <a [routerLink]="'/elementos'"
                class="inline-block bg-accent text-base-100 px-4 py-2 rounded-full text-sm font-medium shadow hover:bg-accent/90 hover:scale-105 transition-transform duration-200">
                Ver Elementos
            </a>
        </div>
    </div>
</section>
