<div class="bg-gradient-to-br from-base-100 to-base-200 p-3 rounded-xl shadow-md border border-primary/30 hover:shadow-xl hover:scale-[1.03] transition-all duration-300 animate-fade-in group">
  <div class="flex flex-row items-center gap-3">
    <!-- Avatar con efecto de brillo -->
    <div class="relative">
      <div class="absolute -inset-0.5 bg-gradient-to-r from-primary to-accent opacity-0 group-hover:opacity-100 rounded-full blur-sm transition-opacity duration-300"></div>
      <img [src]="elemento.avatar" alt="Personaje" class="w-16 h-16 object-cover rounded-full border-2 border-primary/50 shadow-md relative z-10" />
    </div>

    <!-- Información -->
    <div class="flex-1 text-left">
      <h3 class="text-base font-bold text-primary group-hover:text-accent transition-colors duration-300">
        {{ elemento.nombre }}
      </h3>
      <p class="text-sm text-neutral-content/70">{{ elemento.apellido }}</p>
    </div>
  </div>
</div>
