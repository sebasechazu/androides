<nav class="bg-primary text-base-100 px-4 py-3 relative">
    <div class="container mx-auto flex justify-between items-center">
        <!-- Logo -->
        <a [routerLink]="'/home'" class="flex items-center hover:opacity-80 transition-opacity duration-200">
            <img src="assets/img/logo.png" alt="Elementos App" class="h-8 w-auto">
        </a>

        <!-- Botón hamburguesa -->
        <button (click)="isOpen.set(!isOpen())" class="md:hidden text-base-100 focus:outline-none relative z-20"
            aria-label="Toggle menu">
            @if (!isOpen()) {
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"
                class="w-6 h-6">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
            </svg>
            } @else {
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"
                class="w-6 h-6">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
            </svg>
            }
        </button>

        <!-- Menú desktop -->
        <ul class="hidden md:flex gap-8">
            @for (item of items(); track item.label) {
            <li>
                <a [routerLink]="item.link"
                    class="px-3 py-2 rounded-lg font-medium text-white transition-colors duration-200 hover:text-accent hover:bg-white/10">
                    {{ item.label }}
                </a>
            </li>
            }
        </ul>
    </div>

    <!-- Menú móvil dropdown -->
    <div class="absolute top-full left-0 right-0 md:hidden z-10 overflow-hidden"
         [@slideDown]="isOpen() ? 'open' : 'closed'">
        <div class="bg-primary shadow-xl border-t border-blue-800">
            <div class="px-4 py-2">
                @for (item of items(); track item.label) {
                <a [routerLink]="item.link" 
                   (click)="isOpen.set(false)"
                   class="block px-4 py-4 text-white font-medium transition-colors duration-200 
                          hover:bg-white/10 hover:text-accent rounded-lg border-b border-blue-700/30 last:border-b-0"
                   [@fadeInOut]>
                    {{ item.label }}
                </a>
                }
            </div>
        </div>
    </div>
</nav>
