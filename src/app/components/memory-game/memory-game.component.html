<div class="max-w-xl mx-auto text-center py-6">
  <!-- Precarga de imágenes -->
  <div style="display:none">
    @for (card of cards; track card.key) {
      <img [src]="card.img" alt="preload" />
    }
  </div>
  <h2 class="text-2xl font-bold mb-4">Juego de Memoria</h2>
  <div class="flex justify-between items-center mb-6 px-2">
    <span class="text-green-700 font-semibold" [class.score-animate]="animateScore">Aciertos: {{score}}</span>
    <span class="text-red-700 font-semibold" [class.errors-animate]="animateErrors">Errores: {{errors}}</span>
    <button (click)="resetGame()" class="bg-blue-500 text-white px-3 py-1 rounded hover:bg-blue-600 transition">Reiniciar</button>
  </div>
  <div class="grid grid-cols-5 gap-3">
    @for (card of cards; track card.key) {
      <div class="relative aspect-square bg-gray-200 rounded-lg shadow cursor-pointer flex items-center justify-center overflow-hidden flip-card"
        [class.flipped]="card.flipped || card.matched" [class.border-blue-500]="card.flipped || card.matched" [class.border-green-500]="card.matched" [class.border-4]="card.matched" (click)="flipCard(card)">
        @if (card.flipped || card.matched) {
          <img [src]="card.img" alt="Personaje" class="w-full h-full object-cover rounded-lg" />
        } @else {
          <div class="absolute inset-0 bg-gray-400 rounded-lg"></div>
        }
      </div>
    }
  </div>
</div>
