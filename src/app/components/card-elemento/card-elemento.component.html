<div class="bg-gradient-to-br from-base-100 to-base-200 p-5 rounded-xl shadow-md border border-primary/30 hover:shadow-xl hover:scale-[1.03] transition-all duration-300 animate-fade-in group">
  <div class="flex flex-col md:flex-row items-center gap-4">
    <!-- Avatar con efecto de brillo -->
    <div class="relative">
      <div class="absolute -inset-0.5 bg-gradient-to-r from-primary to-accent opacity-0 group-hover:opacity-100 rounded-full blur-sm transition-opacity duration-300"></div>
      <img [src]="elemento.avatar" alt="Personaje" class="w-20 h-20 object-cover rounded-full border-2 border-primary/50 shadow-md relative z-10" />
      
      <!-- Indicador de estado -->
      <div class="absolute bottom-0 right-0 z-20 w-5 h-5 rounded-full shadow-md border-2 border-white"
           [ngClass]="{'bg-green-500': elemento.amigo, 'bg-red-500': !elemento.amigo}">
      </div>
    </div>

    <!-- Información -->
    <div class="flex-1 text-center md:text-left">
      <h3 class="text-lg font-bold text-primary mb-1 group-hover:text-accent transition-colors duration-300">
        {{ elemento.nombre }}
      </h3>
      <p class="text-neutral-content/70">{{ elemento.apellido }}</p>
      
      <!-- Fecha -->
      <div class="text-xs text-neutral-content/50 mt-2 font-mono">
        <span class="inline-block bg-primary/10 px-2 py-1 rounded-md">
          {{ elemento.fechaFabricacion }}
        </span>
      </div>
    </div>
  </div>
</div>
