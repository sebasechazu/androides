<div class="max-w-sm mx-auto mt-10 bg-base-100 shadow-lg rounded-xl overflow-hidden animate-fade-in">
  <!-- Header -->
  <div class="bg-primary text-base-100 text-center py-3">
    <h2 class="text-xl font-bold">Detalle de Androide</h2>
    <p class="text-sm opacity-80">Información del Androide</p>
  </div>

  <!-- Avatar -->
  <div class="flex justify-center mt-4">
    <img class="w-32 h-32 rounded-full shadow-lg border-4 border-accent" [src]="androide()?.avatar"
      [alt]="androide()?.nombre" />
  </div>

  <!-- Info -->
  <div class="p-6 space-y-2 text-center">
    <p><span class="font-semibold text-neutral">Apellido:</span> {{ androide()?.apellido }}</p>
    <p><span class="font-semibold text-neutral">Nombre:</span> {{ androide()?.nombre }}</p>
    <p><span class="font-semibold text-neutral">Fabricación:</span> {{ androide()?.fechaFabricacion }}</p>

    @if (androide()?.amigo) {
    <div class="flex justify-center mt-4">
      <img src="assets/img/amistad.png" alt="Amistad" class="w-8 h-8 animate-bounce" />
    </div>
    }
  </div>

  <!-- Botón -->
  <div class="p-4 flex justify-center">
    <a routerLink="/androides"
      class="inline-flex items-center gap-1 px-4 py-2 bg-accent text-base-100 rounded-full hover:bg-accent/90 transition-transform transform hover:scale-105">
      ⬅ Volver
    </a>
  </div>
</div>
